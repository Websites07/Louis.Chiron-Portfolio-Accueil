<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Louis — Photographe</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #fff;
    color: #111;
  }

  /* ===== HEADER ===== */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: #ffffff;
    height: 84px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 40px;
  }

  /* Instagram icon (left) */
  .insta-link {
    justify-self: start;
    display: flex;
    align-items: center;
  }
  .insta-link svg { width: 24px; height: 24px; display: block; }

  /* Logo (center) */
  .site-logo {
    justify-self: center;
    font-size: 22px;
    letter-spacing: 0.04em;
    color: #111;
    text-decoration: none;
    font-weight: 400;
    text-transform: lowercase;
    font-style: italic;
    font-family: 'Georgia', 'Times New Roman', serif;
  }

  /* Hamburger (right) */
  .burger-btn {
    justify-self: end;
    width: 32px; height: 32px;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
  }
  .burger-btn span {
    display: block;
    width: 26px;
    height: 2px;
    background: #111;
    transition: transform 0.35s ease, opacity 0.35s ease;
  }
  body.menu-open .burger-btn span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  body.menu-open .burger-btn span:nth-child(2) { opacity: 0; }
  body.menu-open .burger-btn span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

  /* ===== NAV OVERLAY ===== */
  .nav-overlay {
    position: fixed;
    inset: 0;
    background: #ffffff;
    z-index: 90;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease;
  }
  body.menu-open .nav-overlay {
    opacity: 1;
    visibility: visible;
  }
  .nav-overlay ul {
    list-style: none;
    text-align: center;
  }
  .nav-overlay li { margin: 22px 0; }
  .nav-overlay a {
    font-size: 32px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #111;
    text-decoration: none;
  }

  /* ===== HERO ===== */
  .hero {
    position: relative;
    height: 100vh;
    min-height: 600px;
    width: 100%;
    /* Remplace l'URL ci-dessous par le lien externe de ton image */
    background-image:
      linear-gradient(rgba(0,0,0,0.15), rgba(0,0,0,0.35)),
      url(https://new.express.adobe.com/webpage/2SzPWQy4IAbXG/resources/79b613ee-3c30-4940-aebe-1c36f385f02a-img_7355_jpe?asset_id=fbc835ff-36fa-4e73-a1d6-c2ee5c0b9e01&img_etag=%222183ecc327234f47a368cc98e87a268b%22&image_assets=false&size=1024);
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 20px;
  }

  .hero-title {
    color: #ffffff;
    font-size: clamp(48px, 10vw, 120px);
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    line-height: 1;
  }

  .hero-subtitle {
    margin-top: 18px;
    color: #ffffff;
    font-size: clamp(11px, 1.4vw, 15px);
    font-weight: 300;
    letter-spacing: 0.35em;
    text-transform: uppercase;
  }

  .hero-cta {
    margin-top: 46px;
    display: inline-block;
    padding: 14px 44px;
    border: 1px solid #ffffff;
    background: rgba(255,255,255,0.12);
    color: #ffffff;
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    text-decoration: none;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .hero-cta:hover {
    background: rgba(255,255,255,0.85);
    color: #111;
  }
</style>
</head>
<body>

  <header>
    <a class="insta-link" href="https://www.instagram.com/i_got_it_picture/" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="20" height="20" rx="6" stroke="#111" stroke-width="1.8"/>
        <circle cx="12" cy="12" r="5" stroke="#111" stroke-width="1.8"/>
        <circle cx="17.6" cy="6.4" r="1.2" fill="#111"/>
      </svg>
    </a>

    <a href="#accueil" class="site-logo">louis</a>

    <button class="burger-btn" id="burgerBtn" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <nav class="nav-overlay" id="navOverlay">
    <ul>
      <li><a href="https://websites07.github.io/Louis.Chiron-Portfolio-Accueil/" class="https://websites07.github.io/Louis.Chiron-Portfolio-Accueil/#contact" target="_self">Accueil</a></li>
      <li><a href="https://websites07.github.io/Louis.Chiron-Portfolio-Photographie/" class="https://websites07.github.io/Portfolio-photographie/" target="_self">Photographie</a></li>
      <li><a href="https://websites07.github.io/Portfolio-web/" class="https://websites07.github.io/Portfolio-web/" target="_self">Sites Web</a></li>
      <li><a href="https://websites07.github.io/Louis.Chiron-Portfolio-Contact/" class="nav-link" target="_self">Contact</a></li>
    </ul>
  </nav>

  <section id="accueil" class="hero">
    <h1 class="hero-title">Louis</h1>
    <p class="hero-subtitle">Photographe basé dans les pays de la Loire</p>
    <a href="louis-contact.html" class="hero-cta">Contact</a>
  </section>

  <script>
    const burgerBtn = document.getElementById('burgerBtn');
    burgerBtn.addEventListener('click', () => {
      document.body.classList.toggle('menu-open');
    });
    document.querySelectorAll('.nav-link').forEach(a => {
      a.addEventListener('click', () => document.body.classList.remove('menu-open'));
    });
  </script>

</body>
</html>
