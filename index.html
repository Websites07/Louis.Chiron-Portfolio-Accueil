<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Louis — Contact</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #fff;
    color: #111;
  }

  /* ===== HEADER ===== */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: #ffffff;
    height: 84px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 40px;
  }

  /* Instagram icon (left) */
  .insta-link {
    justify-self: start;
    display: flex;
    align-items: center;
  }
  .insta-link svg { width: 24px; height: 24px; display: block; }

  /* Logo (center) */
  .site-logo {
    justify-self: center;
    font-size: 22px;
    letter-spacing: 0.04em;
    color: #111;
    text-decoration: none;
    font-weight: 400;
    text-transform: lowercase;
    font-style: italic;
    font-family: 'Georgia', 'Times New Roman', serif;
  }

  /* Hamburger (right) */
  .burger-btn {
    justify-self: end;
    width: 32px; height: 32px;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
  }
  .burger-btn span {
    display: block;
    width: 26px;
    height: 2px;
    background: #111;
    transition: transform 0.35s ease, opacity 0.35s ease;
  }
  body.menu-open .burger-btn span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  body.menu-open .burger-btn span:nth-child(2) { opacity: 0; }
  body.menu-open .burger-btn span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

  /* ===== NAV OVERLAY ===== */
  .nav-overlay {
    position: fixed;
    inset: 0;
    background: #ffffff;
    z-index: 90;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease;
  }
  body.menu-open .nav-overlay {
    opacity: 1;
    visibility: visible;
  }
  .nav-overlay ul {
    list-style: none;
    text-align: center;
  }
  .nav-overlay li { margin: 22px 0; }
  .nav-overlay a {
    font-size: 32px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #111;
    text-decoration: none;
  }

  /* ===== CONTACT PAGE ===== */
  .contact-page {
    min-height: 100vh;
    padding: 200px 20px 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .contact-title {
    font-size: clamp(48px, 10vw, 110px);
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1;
    color: #111;
  }

  .contact-subtitle {
    margin-top: 18px;
    font-size: clamp(11px, 1.4vw, 15px);
    font-weight: 300;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #555;
  }

  .contact-details {
    margin-top: 80px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 70px;
    max-width: 900px;
  }

  .contact-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .contact-icon {
    width: 30px;
    height: 30px;
  }
  .contact-icon svg { width: 100%; height: 100%; display: block; }

  .contact-label {
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #999;
  }

  .contact-value {
    font-size: 17px;
    letter-spacing: 0.03em;
    color: #111;
    text-decoration: none;
  }
  a.contact-value:hover { text-decoration: underline; }

  .contact-regions-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .contact-insta {
    margin-top: 90px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 40px;
    border: 1px solid #ff8a00;
    background: #ff8a00;
    color: #fff;
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    text-decoration: none;
    transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    box-shadow: 0 6px 18px rgba(255, 138, 0, 0.2);
  }
  .contact-insta svg { width: 16px; height: 16px; }
  .contact-insta:hover {
    background: #ff6500;
    border-color: #ff6500;
    color: #fff;
  }
  .contact-insta:hover svg rect,
  .contact-insta:hover svg circle { stroke: #fff; }
  .contact-insta:hover svg circle[fill] { fill: #fff; }

  @media (max-width: 600px) {
    .contact-details { gap: 48px; }
  }
</style>
</head>
<body>

  <header>
    <a class="insta-link" href="https://www.instagram.com/i_got_it_picture/" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="20" height="20" rx="6" stroke="#111" stroke-width="1.8"/>
        <circle cx="12" cy="12" r="5" stroke="#111" stroke-width="1.8"/>
        <circle cx="17.6" cy="6.4" r="1.2" fill="#111"/>
      </svg>
    </a>

    <a href="louis-accueil.html" class="site-logo">louis</a>

    <button class="burger-btn" id="burgerBtn" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <nav class="nav-overlay" id="navOverlay">
    <ul>
      <li><a href="https://websites07.github.io/Louis.Chiron-Portfolio-Accueil/" class="nav-link" target="_self">Accueil</a></li>
      <li><a href="https://websites07.github.io/Portfolio-photographie/" class="nav-link" target="_self">Photographie</a></li>
      <li><a href="https://websites07.github.io/Portfolio-web/" class="nav-link" target="_self">Sites Web</a></li>
      <li><a href="https://websites07.github.io/Louis.Chiron-Portfolio-Contact/" class="nav-link" target="_self">Contact</a></li>
    </ul>
  </nav>

  <section class="contact-page">
    <h1 class="contact-title">Contact</h1>
    <p class="contact-subtitle">Disponible pour vos projets photo et sites web</p>

    <div class="contact-details">
      <div class="contact-block">
        <div class="contact-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 3h3l2 5-2.5 1.5a11 11 0 0 0 5 5L15 12l5 2v3a2 2 0 0 1-2 2C10.5 19 4 12.5 4 6a2 2 0 0 1 2-3z" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="contact-label">Téléphone</span>
        <a class="contact-value" href="tel:+33600000000">06 76 82 38 05</a>
      </div>

      <div class="contact-block">
        <div class="contact-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="#111" stroke-width="1.6"/>
            <path d="M4 6.5l8 6 8-6" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="contact-label">Email</span>
        <a class="contact-value" href="mailto:i_got_it_picture@gmail.com">i_got_it_picture@gmail.com</a>
      </div>

      <div class="contact-block">
        <div class="contact-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/>
            <circle cx="12" cy="9" r="2.4" stroke="#111" stroke-width="1.6"/>
          </svg>
        </div>
        <span class="contact-label">Région</span>
        <ul class="contact-regions-list">
          <li class="contact-value">Pays de la Loire</li>
          <li class="contact-value"></li>
          <li class="contact-value"></li>
        </ul>
      </div>
    </div>

    <a class="contact-insta" href="https://www.instagram.com/i_got_it_picture/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="20" height="20" rx="6" stroke="#111" stroke-width="1.8"/>
        <circle cx="12" cy="12" r="5" stroke="#111" stroke-width="1.8"/>
        <circle cx="17.6" cy="6.4" r="1.2" fill="#111"/>
      </svg>
      Instagram
    </a>
  </section>

  <script>
    const burgerBtn = document.getElementById('burgerBtn');
    burgerBtn.addEventListener('click', () => {
      document.body.classList.toggle('menu-open');
    });
    document.querySelectorAll('.nav-link').forEach(a => {
      a.addEventListener('click', () => document.body.classList.remove('menu-open'));
    });
  </script>

</body>
</html>
